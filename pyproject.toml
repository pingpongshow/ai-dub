[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidub"
dynamic = ["version"]
description = "Local, voice-cloned dubbing of foreign-language video into English"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6",
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
  "pysubs2>=1.7",
  "httpx>=0.27",
  "pyloudnorm>=0.1.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aidub = "aidub.cli:main"

[tool.setuptools.dynamic]
version = { attr = "aidub.__version__" }

[tool.setuptools.packages.find]
include = ["aidub*"]

[tool.setuptools.package-data]
aidub = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
