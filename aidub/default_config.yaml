# Ai Dub defaults. Copy the parts you want to change into /config/config.yaml;
# values there are merged over these. ${NAME} is replaced from the environment
# or from /config/secrets.yaml.

paths:
  appdata: /config          # job database, profiles, logs, settings
  models: /models           # model weights and the per-worker Python environments
  work: /work               # per-job working folders (deleted when a job completes)

# Folders the queue's file browser shows. Only these are visible to Ai Dub.
media:
  - { name: Movies, path: /media/movies }
  - { name: Shows,  path: /media/shows }
  - { name: Anime,  path: /media/anime }

server:
  host: 0.0.0.0
  port: 8790

target_language: en

# Which worker runs each stage. A worker that is missing or fails to start is
# an error for the job; there is no silent switch to another model.
stages:
  separate:    { worker: separate, model: vocals_mel_band_roformer.ckpt }
  diarize:     { worker: diarize, model: nvidia/Nemotron-3-Diarization, window_max_s: 120 }
  speaker:     { worker: speaker }     # ECAPA voice embeddings, gender/age, LaBSE text similarity
  recognize:   { worker: asr, model: Qwen/Qwen3-ASR-1.7B, aligner: Qwen/Qwen3-ForcedAligner-0.6B }
  events:      { worker: events, model: iic/SenseVoiceSmall }
  ocr:         { worker: ocr }
  translate:   { worker: llm, model: RedHatAI/Qwen3.8-27B-MXFP4, gpu_memory_utilization: 0.80, max_model_len: 16384,
                 linear_backend: marlin, attention_backend: TRITON_ATTN,
                 max_num_seqs: 32, enforce_eager: false }   # all scenes at once; CUDA graphs: ~3.5x faster writing
  speak:       { worker: tts-indextts, model: IndexTeam/IndexTTS-2.5 }
  bwe:         { worker: bwe-flashsr, enabled: true, mode: auto }   # auto: only when the original is brighter
  voicedesign: { worker: voicedesign, model: Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign }

# An OpenAI-compatible endpoint can stand in for the built-in translation
# worker (for example a local llama.cpp or Ollama server). Local only.
llm_endpoint:
  enabled: false
  url: http://localhost:11434/v1
  model: qwen3:32b
  api_key: ""

gpu:
  wait: true                # wait (and say so) when another process is using the GPU
  min_free_mb:              # free VRAM needed before a stage starts
    separate: 6000
    diarize: 3000
    speaker: 2000
    recognize: 8000
    events: 2000
    translate: 26000
    speak: 10000
    bwe: 4000
    ocr: 2000
  poll_seconds: 30

ingest:
  skip_english_audio: true
  scene_threshold: 0.35     # ffmpeg scene score for a shot change
  scene_min_pause_s: 1.5    # a pause in speech this long also splits scenes
  song_chapters: [opening, op, ending, ed, preview, insert song, song, credits]

subtitles:
  prefer: [english, source_language, asr]
  min_score: 0.65          # a subtitle for another episode scores under ~0.5
  providers:
    embedded:      { enabled: true }
    sidecar:       { enabled: true }
    bazarr:        { enabled: false, url: "${BAZARR_URL}", api_key: "${BAZARR_API_KEY}",
                     search_missing: true, path_map: [] }
    opensubtitles: { enabled: false, api_key: "${OPENSUBTITLES_API_KEY}",
                     username: "${OPENSUBTITLES_USER}", password: "${OPENSUBTITLES_PASS}" }
    subdl:         { enabled: false, api_key: "${SUBDL_API_KEY}" }
    podnapisi:     { enabled: false }
    jimaku:        { enabled: false, api_key: "${JIMAKU_API_KEY}" }

translate:
  style: natural            # natural | close
  honorifics: keep          # keep | drop (per-show setting overrides)
  reflect: true             # translate -> reflect -> rewrite
  syllables_per_second: 4.3 # voice model's measured pace (plus ~0.25 s per line), used to size lines

speakers:
  link_threshold: 0.62      # cosine similarity to treat two clusters as one voice
  profile_threshold: 0.66   # cosine similarity to match a profile character
  min_clean_seconds: 4.0    # less clean audio than this makes a "minor speaker"
  max_refs_per_character: 8
  ref_min_s: 3.0
  ref_max_s: 15.0

speak:
  takes: 2
  processes: 2              # voice-model processes sharing the GPU (one voices a line at a time, leaving it mostly idle)
  num_beams:                # candidates the voice model weighs per take (empty: its default, 3). 1 + 12 steps
  diffusion_steps:          # saved only ~90 s an episode and left more lines in the original (21 vs 13 of 430)
  emo_alpha: 0.35            # how much of the original line's emotion the dub takes (0.35 judged most natural)
  min_emotion_ref_s: 1.0
  max_similarity_drop: 0.25 # reject a take this far below the character's median similarity
  min_similarity: 0.10
  max_wer: 0.35

fit:
  borrow_ms: 250
  short_line_borrow_ms: 500 # lines shorter than short_line_s may borrow more silence
  short_line_s: 1.0
  factor_min: 0.85
  factor_max: 1.15
  stretch_max: 1.12
  short_factor_min: 0.75    # one- or two-word lines may go this much faster ...
  short_stretch_max: 1.25   # ... and be time-stretched this much
  stretch_min: 0.92
  tolerance_ms: 80

condense:                   # lines that still don't fit get shorter English with the same meaning
  enabled: true
  rounds: 1                 # each round loads the translation, voice and checking models once
  takes: 2                  # takes of every shorter option per round
  line_overhead_s: 0.25

mix:
  sample_rate: 48000
  eq_match: true
  eq_max_db: 6.0
  extra_duck_db: 0.0
  fade_ms: 12

deliver:
  audio_bitrate: 192k
  track_title: "English (AI dub)"
  add_subtitle_tracks: true
  owner: { uid: 99, gid: 100 }

cleanup:
  keep_failed_work: true
